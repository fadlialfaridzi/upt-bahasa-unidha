name: CD - Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -euo pipefail

            REPO_DIR="$HOME/apps/upt-bahasa-unidha"

            mkdir -p "$HOME/apps"
            if [ -d "$REPO_DIR/.git" ]; then
              echo ">>> Repo exists. Updating to latest main..."
              git -C "$REPO_DIR" fetch origin main
              git -C "$REPO_DIR" reset --hard origin/main
              git -C "$REPO_DIR" clean -fd
            else
              echo ">>> Repo not found. Cloning repository..."
              git clone https://github.com/fadlialfaridzi/upt-bahasa-unidha.git "$REPO_DIR"
              git -C "$REPO_DIR" checkout main
            fi
          ENDSSH

          echo ">>> Menulis file .env production..."
          echo "$ENV_PRODUCTION" | ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cat > \$HOME/apps/upt-bahasa-unidha/.env"

          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -euo pipefail

            REPO_DIR="$HOME/apps/upt-bahasa-unidha"

            echo ">>> Build dan jalankan container..."
            docker compose -f "$REPO_DIR/docker-compose.prod.yml" down
            docker compose -f "$REPO_DIR/docker-compose.prod.yml" up --build -d

            echo ">>> Jalankan database migration..."
            docker compose -f "$REPO_DIR/docker-compose.prod.yml" exec -T backend npx prisma migrate deploy

            echo ">>> Bersihkan image lama yang tidak terpakai..."
            docker image prune -f

            echo ">>> Deploy selesai!"
          ENDSSH
