name: CD - Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose files ke VPS
        run: |
          scp -i ~/.ssh/id_ed25519 \
            docker-compose.prod.yml \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/apps/upt-bahasa-unidha/docker-compose.prod.yml

      - name: Deploy ke VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e
            cd ~/apps/upt-bahasa-unidha

            echo ">>> Pull kode terbaru dari GitHub..."
            git pull origin main

            echo ">>> Menulis file .env production..."
            cat > .env << 'EOF'
          ${{ secrets.ENV_PRODUCTION }}
          EOF

            echo ">>> Build dan jalankan container..."
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up --build -d

            echo ">>> Jalankan database migration..."
            docker compose -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy

            echo ">>> Bersihkan image lama yang tidak terpakai..."
            docker image prune -f

            echo ">>> Deploy selesai!"
          ENDSSH
