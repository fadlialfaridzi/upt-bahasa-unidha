services:

  # ================================
  # Database PostgreSQL
  # ================================
  db:
    image: postgres:16-alpine
    container_name: upt_bahasa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-upt_bahasa_db}
      POSTGRES_USER: ${POSTGRES_USER:-uptbahasa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rahasia123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uptbahasa} -d ${POSTGRES_DB:-upt_bahasa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # Backend Node.js + Express
  # ================================
  backend:
    build:
      context: ./backend
      target: development
    container_name: upt_bahasa_backend
    restart: unless-stopped
    # Jalankan migration + seed dulu, baru start server
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js ; npm run dev"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-uptbahasa}:${POSTGRES_PASSWORD:-rahasia123}@db:5432/${POSTGRES_DB:-upt_bahasa_db}
      JWT_SECRET: ${JWT_SECRET:-ganti_secret_ini_di_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: http://localhost:5173
      MAILTRAP_API_KEY: ${MAILTRAP_API_KEY:-71e84677b094539e820b0370cb1ff5a9}
      MAILTRAP_INBOX_ID: ${MAILTRAP_INBOX_ID:-5023099}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # ================================
  # Frontend React (Vite dev server)
  # ================================
  frontend:
    image: node:22-alpine
    container_name: upt_bahasa_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
